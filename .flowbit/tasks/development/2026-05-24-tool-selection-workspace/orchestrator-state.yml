task:
  title: "EPIC 3: Tool Selection Workspace — Frontend Tool List View"
  description: |
    Implement the Tool Selection Workspace — the central interactive area of the app where the user
    discovers available tools, selects up to 5 for comparison, and launches AI analysis.

    GitHub issue #3: https://github.com/plucins/ai-tools-radar/issues/3

    UX Workflow:
      1. Discover tools
      2. Select tools (max 5)
      3. Launch AI analysis
      4. View comparison result

    Technical scope:
    - Backend: GET /tools endpoint, tool data from tools/ Markdown files, shared Tool type
    - Frontend: Tool Selection Workspace (hero block, selected tools header, tool slots grid, add tool modal,
      comparison CTA block), ToolCard component, fuzzy search+filter modal, Framer Motion animations,
      all UI states (loading, error, empty, max reached, min not met)
  status: in_progress
  tags: [epic, frontend, backend, ui]
  priority: high

