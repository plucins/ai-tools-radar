task:
  title: "Comparison Feature & LiteLLM Integration Research"
  description: >
    Investigate the current thread regarding issues #5, #6, #7 — full implementation of the
    AI tool comparison feature. Covers: LiteLLM proxy integration, ComparisonResult data model,
    frontend-backend flow, state propagation (selectedModel), and identification of remaining
    implementation gaps in the comparison pipeline.
  status: in_progress
  tags:
    - comparison
    - llm-integration
    - litellm
    - data-model
    - frontend-backend
  priority: high

research_context:
  research_type: mixed
  research_question: >
    What is the current implementation state of the comparison feature (Start Comparing),
    what gaps remain to deliver a working end-to-end flow per epics #5/#6/#7,
    and what is the correct data model and integration approach for LiteLLM proxy?
  scope:
    included:
      - Backend comparison pipeline (ComparisonService, LlmService, PromptBuilderService)
      - Frontend comparison flow (ToolsPage, ComparisonResultPage, ComparisonResult component)
      - LiteLLM proxy API contract and available endpoints
      - Data model for ComparisonResult (frontend/backend contract)
      - selectedModel state propagation from Sidebar to ToolsPage
      - Issues #5, #6, #7 acceptance criteria
    excluded:
      - Radar chart feature
      - Tool profile authoring workflow
      - Authentication/auth concerns
    constraints:
      - NestJS backend, React+Vite frontend (TypeScript strict)
      - LiteLLM proxy at https://litellm.proxy.innovatingtogether.online
      - OpenAI-compatible API format (/v1/chat/completions)
      - class-validator for DTOs (no zod)
  methodology:
    - mixed-research
    - codebase-analysis
    - requirements-synthesis
    - api-contract-review
